name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=30 "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -euo pipefail
          cd /root/personalWeb

          # Avail KiB on / ; aggressive prune only when disk is tight
          avail_kb() { df -Pk / | awk 'NR==2 {print $4}'; }
          disk_tight() {
            local avail
            avail="$(avail_kb)"
            # < 3GiB free → treat as tight (small VPS safety)
            [ "${avail}" -lt 3145728 ]
          }
          soft_prune() {
            echo "==> soft docker prune (keep build cache)"
            docker container prune -f || true
            docker image prune -f || true
          }
          hard_prune() {
            echo "==> hard docker prune (disk tight — drop images/builder cache)"
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
          }

          echo "==> disk before cleanup"
          df -h /
          if disk_tight; then
            hard_prune
          else
            soft_prune
          fi
          df -h /

          echo "==> git sync"
          git fetch origin
          git reset --hard origin/master
          git --no-pager log -1 --oneline

          echo "==> docker compose build/up"
          export NODE_OPTIONS=--max-old-space-size=1536
          if ! docker compose up --build -d; then
            echo "==> build failed; retry once after hard prune"
            hard_prune
            df -h / || true
            if ! docker compose up --build -d; then
              echo "==> docker compose failed; diagnostics:"
              docker compose logs --tail=80 || true
              docker compose ps || true
              free -h || true
              df -h || true
              exit 1
            fi
          fi

          # Only remove dangling images after success (keep tagged + builder cache)
          docker image prune -f || true
          docker compose ps
          df -h /
          echo "Deploy complete!"
          EOF

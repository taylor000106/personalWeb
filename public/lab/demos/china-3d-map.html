<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>全国 3D 地图 · China Map Lab</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050814;
        color: #e8eefc;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #app {
        position: absolute;
        inset: 0;
      }
      canvas {
        display: block;
      }
      .hud {
        position: absolute;
        z-index: 2;
        pointer-events: none;
      }
      .top {
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .card {
        pointer-events: auto;
        background: rgba(8, 14, 28, 0.72);
        border: 1px solid rgba(120, 160, 255, 0.22);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        padding: 12px 14px;
        max-width: 320px;
      }
      .card h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }
      .card p {
        margin: 6px 0 0;
        font-size: 12px;
        line-height: 1.55;
        color: rgba(220, 230, 255, 0.72);
      }
      .hint {
        font-size: 11px;
        color: rgba(170, 190, 255, 0.65);
      }
      .stat {
        margin-top: 8px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .pill {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(88, 120, 255, 0.16);
        border: 1px solid rgba(120, 160, 255, 0.25);
      }
      #tooltip {
        position: absolute;
        z-index: 3;
        display: none;
        transform: translate(12px, 12px);
        background: rgba(10, 16, 32, 0.92);
        border: 1px solid rgba(140, 180, 255, 0.35);
        border-radius: 10px;
        padding: 10px 12px;
        min-width: 140px;
        pointer-events: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      #tooltip .name {
        font-size: 14px;
        font-weight: 650;
      }
      #tooltip .meta {
        margin-top: 4px;
        font-size: 11px;
        color: rgba(190, 205, 255, 0.75);
      }
      #status {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 4;
        text-align: center;
        font-size: 13px;
        color: rgba(200, 215, 255, 0.85);
      }
      #status.error {
        color: #ffb4b4;
        max-width: 80%;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud top">
      <div class="card">
        <h1>全国省级 3D 地图</h1>
        <p>
          GeoJSON 挤出成三维地形 · 拖拽旋转 / 滚轮缩放 · 悬停查看省份 · 飞线模拟跨城流向
        </p>
        <div class="stat">
          <span class="pill" id="provinceCount">省份 —</span>
          <span class="pill">Three.js</span>
          <span class="pill">Lab Demo</span>
        </div>
      </div>
      <div class="card">
        <p class="hint">
          灵感来自 sc-datav（四川大屏），本 Demo 改为全国省级轮廓。数据：阿里云 DataV 公开边界。
        </p>
        <p class="hint" style="margin-top: 8px" id="hoverHint">悬停省份查看名称</p>
      </div>
    </div>
    <div id="tooltip">
      <div class="name" id="tipName">—</div>
      <div class="meta" id="tipMeta">—</div>
    </div>
    <div id="status">正在加载全国地图数据…</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const app = document.getElementById("app");
      const statusEl = document.getElementById("status");
      const tooltip = document.getElementById("tooltip");
      const tipName = document.getElementById("tipName");
      const tipMeta = document.getElementById("tipMeta");
      const hoverHint = document.getElementById("hoverHint");
      const provinceCount = document.getElementById("provinceCount");

      const GEO_URL = "./data/china-provinces.json";
      const SCALE = 48;
      const CENTER = { lon: 104.2, lat: 35.4 };
      const EXTRUDE = 1.6;

      /** Major city hubs for demo fly lines [lon, lat, label] */
      const HUBS = [
        [116.4, 39.9, "北京"],
        [121.47, 31.23, "上海"],
        [113.26, 23.13, "广州"],
        [104.07, 30.67, "成都"],
        [114.31, 30.52, "武汉"],
        [108.94, 34.34, "西安"],
        [106.55, 29.56, "重庆"],
        [118.8, 32.06, "南京"],
      ];

      const LINKS = [
        [0, 1],
        [0, 2],
        [0, 3],
        [1, 2],
        [1, 4],
        [3, 5],
        [4, 7],
        [2, 6],
      ];

      function project(lon, lat) {
        const x = (lon - CENTER.lon) * SCALE * Math.cos((CENTER.lat * Math.PI) / 180);
        const z = (CENTER.lat - lat) * SCALE;
        return new THREE.Vector2(x, z);
      }

      function ringToShape(ring) {
        const shape = new THREE.Shape();
        ring.forEach(([lon, lat], i) => {
          const p = project(lon, lat);
          if (i === 0) shape.moveTo(p.x, p.y);
          else shape.lineTo(p.x, p.y);
        });
        return shape;
      }

      function featureToShapes(feature) {
        const geom = feature.geometry;
        if (!geom) return [];
        const shapes = [];
        if (geom.type === "Polygon") {
          shapes.push(ringToShape(geom.coordinates[0]));
        } else if (geom.type === "MultiPolygon") {
          for (const poly of geom.coordinates) {
            shapes.push(ringToShape(poly[0]));
          }
        }
        return shapes;
      }

      function createCurve(a, b, height = 12) {
        const start = project(a[0], a[1]);
        const end = project(b[0], b[1]);
        const mid = start.clone().add(end).multiplyScalar(0.5);
        const dist = start.distanceTo(end);
        return new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(start.x, 0.2, start.y),
          new THREE.Vector3(mid.x, Math.max(8, dist * 0.28 + height * 0.2), mid.y),
          new THREE.Vector3(end.x, 0.2, end.y),
        );
      }

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x050814, 1);
      app.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050814, 0.012);

      const camera = new THREE.PerspectiveCamera(
        42,
        window.innerWidth / window.innerHeight,
        0.1,
        2000,
      );
      camera.position.set(0, 95, 120);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.minDistance = 40;
      controls.maxDistance = 220;
      controls.maxPolarAngle = Math.PI * 0.48;
      controls.target.set(0, 0, 0);

      scene.add(new THREE.AmbientLight(0x9eb6ff, 0.55));
      const key = new THREE.DirectionalLight(0xffffff, 1.05);
      key.position.set(40, 80, 30);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x66ccff, 0.45);
      rim.position.set(-50, 30, -40);
      scene.add(rim);

      const mapRoot = new THREE.Group();
      scene.add(mapRoot);

      const provinceMeshes = [];
      const flyLines = [];
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let hovered = null;

      const baseMat = new THREE.MeshStandardMaterial({
        color: 0x1a2d55,
        metalness: 0.15,
        roughness: 0.55,
        emissive: 0x0a1630,
        emissiveIntensity: 0.35,
      });
      const hoverMat = new THREE.MeshStandardMaterial({
        color: 0x3d7cff,
        metalness: 0.2,
        roughness: 0.35,
        emissive: 0x1a4cff,
        emissiveIntensity: 0.7,
      });
      const edgeMat = new THREE.LineBasicMaterial({
        color: 0x7eb6ff,
        transparent: true,
        opacity: 0.55,
      });

      async function buildMap() {
        const res = await fetch(GEO_URL);
        if (!res.ok) throw new Error(`GeoJSON 加载失败：${res.status}`);
        const geo = await res.json();
        const features = geo.features || [];
        provinceCount.textContent = `省份 ${features.length}`;

        const extrudeSettings = {
          depth: EXTRUDE,
          bevelEnabled: true,
          bevelThickness: 0.12,
          bevelSize: 0.08,
          bevelSegments: 1,
        };

        for (const feature of features) {
          const name = feature.properties?.name || "未知";
          const adcode = feature.properties?.adcode;
          const shapes = featureToShapes(feature);
          if (!shapes.length) continue;

          const geom = new THREE.ExtrudeGeometry(shapes, extrudeSettings);
          geom.rotateX(-Math.PI / 2);
          const mesh = new THREE.Mesh(geom, baseMat.clone());
          mesh.userData = { name, adcode, type: "province" };
          mapRoot.add(mesh);
          provinceMeshes.push(mesh);

          const edges = new THREE.EdgesGeometry(geom, 28);
          const line = new THREE.LineSegments(edges, edgeMat);
          mapRoot.add(line);
        }

        // Ground glow disk
        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(95, 64),
          new THREE.MeshBasicMaterial({
            color: 0x102048,
            transparent: true,
            opacity: 0.35,
          }),
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        mapRoot.add(ground);

        // City hubs + fly lines
        const hubGroup = new THREE.Group();
        mapRoot.add(hubGroup);
        const hubGeo = new THREE.SphereGeometry(0.55, 12, 12);
        const hubMat = new THREE.MeshBasicMaterial({ color: 0x9fd0ff });
        const hubPositions = HUBS.map(([lon, lat]) => {
          const p = project(lon, lat);
          const mesh = new THREE.Mesh(hubGeo, hubMat);
          mesh.position.set(p.x, EXTRUDE + 0.4, p.y);
          hubGroup.add(mesh);
          return mesh.position.clone();
        });

        for (const [i, j] of LINKS) {
          const curve = createCurve(HUBS[i], HUBS[j]);
          const points = curve.getPoints(48);
          const geo = new THREE.BufferGeometry().setFromPoints(points);
          const mat = new THREE.LineBasicMaterial({
            color: 0x5cc8ff,
            transparent: true,
            opacity: 0.35,
          });
          const line = new THREE.Line(geo, mat);
          hubGroup.add(line);

          const dot = new THREE.Mesh(
            new THREE.SphereGeometry(0.35, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0xffffff }),
          );
          hubGroup.add(dot);
          flyLines.push({ curve, dot, t: Math.random() });
        }

        statusEl.style.display = "none";
      }

      function setHovered(mesh) {
        if (hovered === mesh) return;
        if (hovered) hovered.material = baseMat.clone();
        hovered = mesh;
        if (hovered) {
          hovered.material = hoverMat.clone();
          tipName.textContent = hovered.userData.name;
          tipMeta.textContent = `adcode ${hovered.userData.adcode ?? "—"}`;
          tooltip.style.display = "block";
          hoverHint.textContent = `当前：${hovered.userData.name}`;
        } else {
          tooltip.style.display = "none";
          hoverHint.textContent = "悬停省份查看名称";
        }
      }

      function onPointerMove(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        tooltip.style.left = `${event.clientX - rect.left}px`;
        tooltip.style.top = `${event.clientY - rect.top}px`;

        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(provinceMeshes, false);
        setHovered(hits[0]?.object || null);
      }

      renderer.domElement.addEventListener("pointermove", onPointerMove);
      renderer.domElement.addEventListener("pointerleave", () => setHovered(null));

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        const t = performance.now() * 0.001;
        mapRoot.rotation.y = Math.sin(t * 0.12) * 0.04;
        for (const fly of flyLines) {
          fly.t = (fly.t + 0.004) % 1;
          const p = fly.curve.getPoint(fly.t);
          fly.dot.position.copy(p);
        }
        renderer.render(scene, camera);
      }

      buildMap()
        .then(() => animate())
        .catch((err) => {
          console.error(err);
          statusEl.classList.add("error");
          statusEl.textContent =
            "地图加载失败。请确认 ./data/china-provinces.json 存在，并允许加载 Three.js CDN。";
        });
    </script>
  </body>
</html>

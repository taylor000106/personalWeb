<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SSE Stream Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111827;
        --panel: #0b1220;
        --line: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #34d399;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100vh;
        padding: 16px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      button {
        border: 1px solid #374151;
        background: #1f2937;
        color: var(--text);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary {
        background: #065f46;
        border-color: #059669;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
      }
      .status[data-state="open"] {
        color: var(--accent);
      }
      .status[data-state="error"] {
        color: #f87171;
      }
      .out {
        flex: 1;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        padding: 16px 18px;
        line-height: 1.65;
        white-space: pre-wrap;
        font-size: 14px;
      }
      .out h1,
      .out h2,
      .out h3 {
        margin: 0.8em 0 0.35em;
        line-height: 1.3;
      }
      .out code {
        background: #1f2937;
        padding: 0.1em 0.35em;
        border-radius: 4px;
        font-size: 0.92em;
      }
      .out pre {
        background: #1f2937;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
      }
      .out strong {
        color: #a7f3d0;
      }
      .cursor::after {
        content: "▍";
        margin-left: 2px;
        animation: blink 1s step-end infinite;
        color: var(--accent);
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="toolbar">
        <button class="primary" id="startBtn" type="button">开始推流</button>
        <button id="stopBtn" type="button" disabled>停止</button>
        <span class="status" id="status" data-state="idle">空闲</span>
      </div>
      <div class="out" id="out"></div>
    </div>
    <script>
      const out = document.getElementById("out");
      const statusEl = document.getElementById("status");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      let es = null;
      let raw = "";

      function setStatus(state, text) {
        statusEl.dataset.state = state;
        statusEl.textContent = text;
      }

      function renderMarkdown(text) {
        const escaped = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
        return escaped
          .replace(/^### (.+)$/gm, "<h3>$1</h3>")
          .replace(/^## (.+)$/gm, "<h2>$1</h2>")
          .replace(/^# (.+)$/gm, "<h1>$1</h1>")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
      }

      function paint(streaming) {
        out.innerHTML = renderMarkdown(raw) + (streaming ? '<span class="cursor"></span>' : "");
        out.scrollTop = out.scrollHeight;
      }

      function stop() {
        if (es) {
          es.close();
          es = null;
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
        paint(false);
      }

      startBtn.addEventListener("click", () => {
        stop();
        raw = "";
        paint(true);
        startBtn.disabled = true;
        stopBtn.disabled = false;
        setStatus("open", "connecting...");

        es = new EventSource("/api/lab/stream");
        es.onopen = () => setStatus("open", "streaming");
        es.onmessage = (ev) => {
          try {
            const payload = JSON.parse(ev.data);
            if (payload.done) {
              setStatus("idle", "done");
              stop();
              return;
            }
            raw += payload.text || "";
            paint(true);
          } catch {
            raw += ev.data;
            paint(true);
          }
        };
        es.onerror = () => {
          setStatus("error", "disconnected");
          stop();
        };
      });

      stopBtn.addEventListener("click", () => {
        setStatus("idle", "stopped");
        stop();
      });
    </script>
  </body>
</html>

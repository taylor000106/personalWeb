<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatAI · Demo</title>
    <style>
      :root {
        --accent: #6965ea;
        --bg: #0b0b12;
        --phone: #111118;
        --line: #e5e5e5;
        --reply: #f5f5f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at top, rgba(105, 101, 234, 0.22), transparent 55%),
          var(--bg);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #111;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 28px;
      }
      .badge {
        color: #c4c4ff;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .phone {
        width: 390px;
        height: 780px;
        border-radius: 36px;
        background: #000;
        border: 10px solid #1c1c24;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .status {
        height: 28px;
        background: #000;
        color: #fff;
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        opacity: 0.85;
      }
      .header {
        height: 48px;
        background: #000;
        color: #fff;
        display: grid;
        grid-template-columns: 40px 1fr 40px;
        align-items: center;
        padding: 0 12px;
        font-size: 15px;
      }
      .header .title {
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .list {
        flex: 1;
        background: #fff;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .msg {
        display: flex;
        gap: 10px;
        padding: 16px 14px;
        font-size: 14px;
        line-height: 1.65;
      }
      .msg.user {
        background: #fff;
      }
      .msg.assistant {
        background: var(--reply);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
      }
      .msg.user .avatar {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
      }
      .msg.assistant .avatar {
        background: linear-gradient(135deg, #0ea5e9, #2563eb);
      }
      .bubble {
        flex: 1;
        min-width: 0;
        color: #222;
      }
      .bubble code {
        display: inline-block;
        background: #ececff;
        color: #4338ca;
        border-radius: 4px;
        padding: 0 4px;
        font-size: 12px;
      }
      .bubble ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }
      .typing {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        height: 18px;
      }
      .typing span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #6965ea;
        animation: blink 1.1s infinite ease-in-out;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }
      .composer-wrap {
        background: #fff;
        border-top: 1px solid #eee;
        padding: 8px 12px 14px;
      }
      .tools {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        color: #fff;
        background: #ccc;
        margin: -8px -12px 10px;
        padding: 8px 14px;
      }
      .tools span {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        background: #666;
        display: inline-block;
      }
      .composer {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #ccc;
        border-radius: 14px;
        padding: 8px 8px 8px 12px;
        min-height: 46px;
      }
      .composer input {
        flex: 1;
        border: 0;
        outline: 0;
        font-size: 14px;
        background: transparent;
      }
      .send {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--accent);
        border: 0;
        color: #fff;
        display: grid;
        place-items: center;
        cursor: default;
      }
      .platforms {
        display: flex;
        gap: 8px;
        color: #9ca3af;
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      .platforms b {
        color: #ddd6fe;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="badge">ChatAI Multi-platform · UI Demo</div>
      <div class="phone" id="phone">
        <div class="status">
          <span>9:41</span>
          <span>5G · 87%</span>
        </div>
        <div class="header">
          <div>‹</div>
          <div class="title">ChatAI</div>
          <div></div>
        </div>
        <div class="list">
          <div class="msg user">
            <div class="avatar">U</div>
            <div class="bubble">用三点说明 SSE 流式对话怎么做？</div>
          </div>
          <div class="msg assistant">
            <div class="avatar">AI</div>
            <div class="bubble">
              可以按这条链路落地：
              <ul>
                <li>服务端按 token 推送 <code>text/event-stream</code></li>
                <li>客户端增量拼接，支持中断与重连</li>
                <li>会话态与异常态要和支付 / 登录解耦</li>
              </ul>
            </div>
          </div>
          <div class="msg user">
            <div class="avatar">U</div>
            <div class="bubble">小程序和 H5 能共用同一套对话组件吗？</div>
          </div>
          <div class="msg assistant" id="streaming">
            <div class="avatar">AI</div>
            <div class="bubble">
              <span id="streamText"></span
              ><span class="typing" id="dots"
                ><span></span><span></span><span></span
              ></span>
            </div>
          </div>
        </div>
        <div class="composer-wrap">
          <div class="tools"><span></span><span></span></div>
          <div class="composer">
            <input value="继续讲多端状态同步…" readonly />
            <button class="send" aria-label="send">✈</button>
          </div>
        </div>
      </div>
      <div class="platforms">
        <b>uni-app</b> · Mini Program · App · H5 · SSE / WebSocket
      </div>
    </div>
    <script>
      const text =
        "可以。业务层用 uni-app 收敛，流式与会话模型保持一致，按端做登录 / 支付适配即可。";
      const el = document.getElementById("streamText");
      const dots = document.getElementById("dots");
      const shot = new URLSearchParams(location.search).has("shot");
      if (shot) {
        el.textContent = text;
        if (dots) dots.remove();
      } else {
        let i = 0;
        function tick() {
          if (i <= text.length) {
            el.textContent = text.slice(0, i);
            i += 1;
            setTimeout(tick, 28);
          } else if (dots) {
            dots.remove();
          }
        }
        setTimeout(tick, 400);
      }
    </script>
  </body>
</html>

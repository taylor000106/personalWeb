server {
    listen 80;
    server_name yywtaylor.cyou www.yywtaylor.cyou;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yywtaylor.cyou www.yywtaylor.cyou;

    ssl_certificate     /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/yywtaylor.cyou.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 森系生活工作台 · 闲鱼演示预览（静态 dist）
    location = /workbuddy {
        return 301 /workbuddy/;
    }

    location /workbuddy/ {
        alias /usr/share/nginx/html/workbuddy/;
        index index.html;
        # 本应用为前端 state 路由，无深链；仅静态资源 + index
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
